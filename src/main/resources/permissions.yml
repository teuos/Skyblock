# This is the permissions config file, here you can define what permissions you wish the player to have per group
# A list of available permissions can be found in the documentation.
# Group inheritance can be toggled in config.yml (Enabled by default)

manager:
  weight:
    - -100
  inherits:
    - builder
  permissions:
    - skyblock.protect.island.bypass
    - skyblock.protect.island.manage

builder:
  weight:
    - -110
  inherits:
    - container
  permissions:
    - skyblock.protect.block.break
    - skyblock.protect.block.place
    - skyblock.protect.block.trample
    - skyblock.protect.block.spread
    - skyblock.protect.block.grow
    - skyblock.protect.fluid.flow
    - skyblock.protect.interact.button
    - skyblock.protect.interact.lever

container:
  weight:
    - -120
  inherits:
    - interact
  permissions:
    - skyblock.protect.container.chest
    - skyblock.protect.container.furnace
    - skyblock.protect.container.hopper
    - skyblock.protect.container.inventory
    - skyblock.protect.container.drop
    - skyblock.protect.entity.itemframe
    - skyblock.protect.entity.armorstand

interact:
  weight:
    - -130
  inherits:
    - visitor
  permissions:
    - skyblock.protect.interact.player
    - skyblock.protect.interact.entity
    - skyblock.protect.interact.door
    - skyblock.protect.interact.trapdoor
    - skyblock.protect.interact.fencegate
    - skyblock.protect.interact.bed

visitor:
  weight:
    - -140
  inherits:
    - global
  permissions: []

global:
  permissions: []